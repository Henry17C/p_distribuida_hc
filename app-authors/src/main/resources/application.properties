%dev.quarkus.datasource.dev-ui.allow-sql=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
#quarkus.datasource.password=12345
quarkus.datasource.password=labcom2015
quarkus.datasource.jdbc.url=jdbc:postgresql://dbserver:5432/postgres
#quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres


quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.show-sql=true


# tiene on-migrate=true en vez de on-start=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.http.port=8080

#configuracion del consul
#consul.host=consul
consul.host=127.0.0.1
consul.port=8500

# Configuración para Micrometer y Prometheus
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Configuración para SmallRye Health

quarkus.smallrye-health.ui.enable=true
quarkus.http.auth.permission.health-ui.paths=/q/health-ui/*
quarkus.http.auth.permission.health-ui.policy=permit