http:
  services:
    service-app-authors:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"
          - url: "http://127.0.0.1:8081"
    service-app-books:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9090"
          - url: "http://127.0.0.1:9091"
          - url: "http://127.0.0.1:9092"
  middlewares:
    strip-prefix-authors:
      stripPrefix:
        prefixes:
          - "/app-authors"
    strip-prefix-books:
      stripPrefix:
        prefixes:
          - "/app-books"