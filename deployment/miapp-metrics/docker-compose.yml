# docker compose up -d

version: '3.3'
services:

  proxy:
    image: traefik:3.4.1

    command: |
      --api.insecure=true
      --api.dashboard=true
      --providers.consulCatalog
      --providers.consulCatalog.refreshInterval=5s
      --providers.consulCatalog.exposedByDefault=false
      --providers.consulCatalog.endpoint.address=consul:8500
      --entryPoints.http.address=":80"
      --entryPoints.metrics.address=":8082"
      --metrics.prometheus=true
      --metrics.prometheus.entryPoint=metrics

    ports:
      - "8888:8080" # Traefik Dashboard
      - "8080:80" # HTTP
    expose:
      - 80
    depends_on:
      - consul


  dbserver:
    image: postgres:17.5-alpine3.22
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: distribuida
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "c:/db-distribuida:/var/lib/postgresql/data"
    ports:
      - "1111:5432"

    expose:
      - 5432
  consul:
    image: consul:1.15.4
    command:
      agent -dev
      -ui 
      -bind 0.0.0.0
      -client 0.0.0.0
    ports:
        - "8500:8500"
    expose:
        - 8500

  author:
    image: henry170/app-authors:latest
    environment:
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://dbserver:5432/distribuida
      QUARKUS_HTTP_PORT: 8080
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      - dbserver
      - consul
    #ports:
    #  - "9090:8080"
    deploy:
      replicas: 2
    #expose:
    #  - 8080
  books:
    image: henry170/app-books:latest
    environment:
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://dbserver:5432/distribuida
      QUARKUS_HTTP_PORT: 8080
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      AUTHOR_URL: http://author:8080
    depends_on:
      - dbserver
      - consul
    ports:
      - "7070:8080"
    deploy:
      replicas: 1
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - "./configs:/etc/prometheus"
    ports:
      - "9090:9090"
    expose:
      - 9090
  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3000:3000"
    expose:
      - 3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin # Puedes cambiar 'admin' por el usuario que quieras
      - GF_SECURITY_ADMIN_PASSWORD=admin


