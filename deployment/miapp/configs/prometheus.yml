global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'authors-app'
    scrape_interval: 5s
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['authors:8080']

  - job_name: 'proxy'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'proxy:8082' ]

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgresql-exporter:9187']




